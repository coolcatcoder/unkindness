[package]
name = "unkindness"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["input", "procedural_macros", "scene"]

[dependencies]
#procedural_macros = { path = "procedural_macros" }
bevy = { version = "0.20", default-features = false, features = [
    "bevy_scene",
] }
duck_back = { version = "1.4.0", optional = true }
input = { path = "input", optional = true }

[features]
input = ["dep:input"]
error_handling = ["dep:duck_back"]
default = ["error_handling"]
